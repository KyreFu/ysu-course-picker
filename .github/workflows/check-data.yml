name: Check course data

on:
  push:
    paths: ['data/**', '.github/workflows/check-data.yml']
  pull_request:
    paths: ['data/**', '.github/workflows/check-data.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Runs the same data/checks.js the browser validator uses. Only the
      # data-level tier runs here: the render tier needs a live graph, which
      # is what validate.html is for.
      - name: Run data checks
        run: node .github/workflows/run-checks.mjs
